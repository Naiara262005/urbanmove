[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanmove"
version = "0.1.0"
description = "UrbanMove: sistema distribuido de movilidad urbana (bicicletas y patinetes eléctricos)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["shared*"]

[tool.setuptools.package-data]
shared = ["py.typed"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ANN",      # type hints obligatorios
    "S",        # seguridad (bandit)
    "PT",       # buenas prácticas pytest
    "T20",      # prohíbe print()
    "DTZ",      # prohíbe datetimes sin zona horaria
    "RUF",
]
ignore = ["ANN401"]  # `Any` permitido de forma explícita (p. ej. payload de eventos)

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "ANN"]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.ruff.format]
quote-style = "double"

# -------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "services", "lambdas"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requiere LocalStack levantado (make up)",
]

# ------------------------------------------------------------ Coverage
[tool.coverage.run]
source = ["shared"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
