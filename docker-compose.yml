services:
  localstack:
    image: localstack/localstack:4.14.0
    container_name: urbanmove-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,sns,sqs,lambda,logs,iam,sts
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=0
      - PERSISTENCE=0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
